[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-data-platform"
version = "0.1.0"
description = "Incremental, tested data pipeline for German electricity market and weather data: Python ingestion, DuckDB, dbt and Dagster."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Soban Siddique" }]
dependencies = [
    "duckdb>=1.1",
    "httpx",
    "pydantic>=2",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "dagster>=1.10",
    "dagster-dbt>=0.26",
    "dagster-webserver>=1.10",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
edp = "energy_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
