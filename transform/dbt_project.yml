name: energy_platform
version: "0.1.0"
config-version: 2
profile: energy_platform

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

models:
  energy_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

data_tests:
  energy_platform:
    +store_failures: true   # failing rows are kept in the warehouse for investigation
    +schema: test_failures
