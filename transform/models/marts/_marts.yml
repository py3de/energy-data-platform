version: 2
models:
  - name: fct_energy_hourly
    description: >
      Hourly fact table: day-ahead price, wind and solar generation, grid load and German weather.
      Incremental with a 48-hour lookback so revised source values are applied.
    config:
      contract: {enforced: true}   # the column names and types below are a promise to downstream users
    columns:
      - name: hour_utc
        data_type: timestamp
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: hour_local
        data_type: timestamp
        description: Hour in Europe/Berlin, the market's delivery time zone.
      - name: price_eur_mwh
        data_type: double
        description: Day-ahead price DE-LU. EPEX limits are -500 to 4000 EUR/MWh.
        data_tests:
          - value_between: {arguments: {min_value: -500, max_value: 4000}}
      - name: solar_mwh
        data_type: double
        data_tests: [not_negative]
      - name: wind_onshore_mwh
        data_type: double
        data_tests: [not_negative]
      - name: wind_offshore_mwh
        data_type: double
        data_tests: [not_negative]
      - name: wind_solar_mwh
        data_type: double
      - name: grid_load_mwh
        data_type: double
        data_tests: [not_negative]
      - name: wind_solar_share
        data_type: double
        description: Wind and solar generation as a share of grid load. Above 1 is possible (exports).
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 2}}
      - name: avg_temperature_c
        data_type: double
      - name: avg_wind_speed_100m_kmh
        data_type: double
      - name: avg_shortwave_radiation_wm2
        data_type: double
      - name: weather_locations
        data_type: bigint
      - name: is_complete
        data_type: boolean
        description: True when every SMARD series and all three weather locations are present.
      - name: source_loaded_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp
  - name: mart_daily_energy
    description: Daily summary per German delivery day.
    columns:
      - name: delivery_day
        data_tests: [unique, not_null]
