name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EDP_OFFLINE: "1"                    # recorded API responses, no network needed
      EDP_NOW: "2026-11-17T23:00:00Z"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest -q
      - name: Full pipeline (ingest + dbt build)
        run: edp run
      - name: Source freshness
        run: edp freshness
      - name: dbt docs
        run: |
          cd transform
          EDP_DB_PATH=../data/warehouse.duckdb dbt docs generate --profiles-dir .
